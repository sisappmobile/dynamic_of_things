plugins {
    id "com.android.application"
    // ❌ Remove: id "kotlin-android"   <-- causes the KGP warning
    id "dev.flutter.flutter-gradle-plugin"  // Flutter's plugin handles Kotlin now
}
android {
    namespace = "com.sisapp.dot.example"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId = "com.sisapp.dot.example"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}
flutter {
    source = "../.."
}